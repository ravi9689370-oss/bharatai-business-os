version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    container_name: bharatai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bharatai
      POSTGRES_USER: bharatai
      POSTGRES_PASSWORD: bharatai
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
